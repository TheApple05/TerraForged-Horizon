name: Horizon procedural density integration

on:
  push:
    paths: ['horizon/native-core/**', 'horizon/native-adapter/**', 'horizon/native-host/**', 'horizon/native-world/**', 'horizon/native-content/**', 'horizon/tests/**', 'horizon/tools/**', '.github/workflows/native-host.yml']
  pull_request:
    paths: ['horizon/native-core/**', 'horizon/native-adapter/**', 'horizon/native-host/**', 'horizon/native-world/**', 'horizon/native-content/**', 'horizon/tests/**', 'horizon/tools/**', '.github/workflows/native-host.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-host-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  density-graph:
    strategy:
      fail-fast: false
      matrix:
        mode: [graph, registry, world, entry, ui]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component clippy --component rustfmt
      - name: Install native client build headers
        if: matrix.mode == 'ui'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev libudev-dev
      - name: Check out pinned source tools only
        shell: bash
        run: |
          git init build/qa/horizon/host-source
          git -C build/qa/horizon/host-source remote add origin https://github.com/TheApple05/horizon.git
          git -C build/qa/horizon/host-source fetch --depth=1 origin f43eebfc04b73f0c2bbf5048f7a3ab36c240f21d
          git -C build/qa/horizon/host-source checkout --detach FETCH_HEAD
          git init build/qa/horizon/mixin-source
          git -C build/qa/horizon/mixin-source remote add origin https://github.com/horizon-rust/horizon-mixins.git
          git -C build/qa/horizon/mixin-source fetch --depth=1 origin e8cd0aa38cffef49cb2e088ef716baa107148c02
          git -C build/qa/horizon/mixin-source checkout --detach FETCH_HEAD
      - name: Fetch pinned Rust libraries and build the mixin tool
        shell: bash
        run: |
          cargo fetch --locked --manifest-path build/qa/horizon/host-source/Cargo.toml
          cargo build --locked --manifest-path build/qa/horizon/mixin-source/Cargo.toml -p horizon-mixins-cli
      - name: Assemble and stage the native bundle
        run: python horizon/tools/stage_native_host.py ${{ matrix.mode == 'ui' && '--ui' || matrix.mode == 'entry' && '--entry' || matrix.mode == 'world' && '--world' || matrix.mode == 'registry' && '--registry' || '' }} --horizon build/qa/horizon/host-source --mixins build/qa/horizon/mixin-source/target/debug/horizon-mixins --output build/qa/horizon/ci-host
      - name: Check compiled densities and ownership
        shell: bash
        run: |
          if [ '${{ matrix.mode }}' = ui ]; then
            packages=(-p horizon-client -p horizon-client-lib)
          elif [ '${{ matrix.mode }}' = graph ]; then
            packages=(-p horizon-core)
          else
            packages=(-p horizon-world)
          fi
          cargo clippy --offline --locked --manifest-path build/qa/horizon/ci-host/staged/Cargo.toml "${packages[@]}" --lib -- -D warnings
      - name: Check fresh UI setup and owned-client exit evidence
        if: matrix.mode == 'ui'
        run: python -m unittest discover -s horizon/tools -p 'test_native_ui_*.py'
      - name: Check density observations
        if: matrix.mode == 'graph' || matrix.mode == 'registry'
        shell: bash
        run: |
          python horizon/tools/verify_host_density.py ${{ matrix.mode == 'registry' && '--registry' || '' }} --workspace build/qa/horizon/ci-host/staged --report build/qa/ci/native-host-density.json
      - name: Check the pinned pipeline API and source-only lifecycle
        if: matrix.mode == 'world' || matrix.mode == 'entry' || matrix.mode == 'ui'
        shell: bash
        run: |
          mkdir -p build/qa/ci
          python horizon/tools/generate_pipeline_forwarding.py --horizon build/qa/horizon/host-source --check > build/qa/ci/native-world-forwarding.log
          cargo test --offline --locked --manifest-path build/qa/horizon/ci-host/staged/Cargo.toml -p horizon-core --lib terraforged_ > build/qa/ci/native-world-lifecycle.log
          cargo test --offline --locked --manifest-path build/qa/horizon/ci-host/staged/Cargo.toml -p horizon-world --lib --no-run > build/qa/ci/native-world-test-cfg.log 2>&1
      - name: Preserve qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-host-density-${{ matrix.mode }}-${{ github.sha }}
          path: |
            build/qa/ci/native-host-density.json
            build/qa/ci/native-world-*.log
            build/qa/horizon/ci-host/stage-result.json
            build/qa/horizon/ci-host/native-host-density/*.log
          if-no-files-found: warn
          retention-days: 14
