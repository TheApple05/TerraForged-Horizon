name: Horizon native noise foundation

on:
  push:
    paths: ['horizon/native-core/**', 'horizon/native-adapter/**', 'horizon/native-host/**', 'horizon/tests/**', 'horizon/tools/**', 'tests/core/reference-*', '.github/workflows/native-noise.yml']
  pull_request:
    paths: ['horizon/native-core/**', 'horizon/native-adapter/**', 'horizon/native-host/**', 'horizon/tests/**', 'horizon/tools/**', 'tests/core/reference-*', '.github/workflows/native-noise.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      TERRAFORGED_JAVA_ROOT: ${{ github.workspace }}/build/reference-java
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Check out pinned Java reference sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: TheApple05/TerraForged-26.2
          ref: c7a477a4a272ef34df9d3f55a95f185f264b40ec
          path: build/reference-java
          persist-credentials: false
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component clippy --component rustfmt
      - name: Check independent Java fixtures
        shell: bash
        run: |
          python horizon/tools/generate_noise_vectors.py
          python horizon/tools/install_native_math_table.py
          python horizon/tools/install_biome_table.py
          python horizon/tools/verify_native_scalars.py --report build/qa/ci/native-scalars.json
          python horizon/tools/verify_native_noise.py --report build/qa/ci/native-noise.json
          python horizon/tools/verify_native_noise.py --family second --report build/qa/ci/native-noise-second-family.json
          python horizon/tools/verify_native_noise.py --family composition --report build/qa/ci/native-noise-composition.json
          python horizon/tools/verify_native_noise.py --family math --report build/qa/ci/native-math.json
          python horizon/tools/verify_native_noise.py --family core --report build/qa/ci/native-core.json
          python horizon/tools/verify_native_noise.py --family sources --report build/qa/ci/native-noise-sources.json
          python horizon/tools/verify_native_noise.py --family power --report build/qa/ci/native-power.json
          python horizon/tools/verify_native_noise.py --family shaping --report build/qa/ci/native-noise-shaping.json
          python horizon/tools/verify_native_noise.py --family cellular --report build/qa/ci/native-noise-cellular.json
          python horizon/tools/verify_native_noise.py --family final --report build/qa/ci/native-noise-final.json
          python horizon/tools/verify_native_noise.py --family visitors --report build/qa/ci/native-noise-visitors.json
          python horizon/tools/verify_native_noise.py --family cell --report build/qa/ci/native-cell-foundation.json
          python horizon/tools/verify_native_noise.py --family terrain --report build/qa/ci/native-terrain.json
          python horizon/tools/verify_native_noise.py --family biome --report build/qa/ci/native-biome.json
          python horizon/tools/verify_native_noise.py --family random --report build/qa/ci/native-java-random.json
          python horizon/tools/verify_native_utilities.py --report build/qa/ci/native-utilities.json
          python horizon/tools/verify_classic_pillar_math.py --report build/qa/ci/native-classic-pillar-math.json
          python horizon/tools/verify_pillar_sampler.py --report build/qa/ci/native-pillar-sampler.json
          python horizon/tools/verify_marsh_sampler.py --report build/qa/ci/native-marsh-material-sampler.json
          python horizon/tools/verify_native_spawn.py --report build/qa/ci/native-spawn-centers.json
      - name: Fetch locked registry adapter libraries
        run: cargo fetch --locked --manifest-path horizon/native-adapter/Cargo.toml
      - name: Check native biome resource transformations
        run: |
          cargo fmt --manifest-path horizon/native-adapter/Cargo.toml --check
          cargo clippy --offline --locked --manifest-path horizon/native-adapter/Cargo.toml --lib --bin classic_biome_data_probe -- -D warnings
          cargo test --offline --locked --manifest-path horizon/native-adapter/Cargo.toml --lib
      - name: Check actual registry and codec observations
        shell: bash
        run: |
          python horizon/tools/verify_native_registry.py --report build/qa/ci/native-registry.json
          python horizon/tools/verify_native_registry.py --family preset --report build/qa/ci/native-preset.json
          python horizon/tools/verify_native_registry.py --family continent --report build/qa/ci/native-continent.json
          python horizon/tools/verify_native_registry.py --family populators --report build/qa/ci/native-populators.json
          python horizon/tools/verify_native_registry.py --family terrain-factories --report build/qa/ci/native-terrain-factories.json
          python horizon/tools/verify_native_registry.py --family terrain-provider --report build/qa/ci/native-terrain-provider.json
          python horizon/tools/verify_native_registry.py --family heightmap-climate --report build/qa/ci/native-heightmap-climate.json
          python horizon/tools/verify_kernel_terrain.py --report build/qa/ci/native-original-kernel-terrain.json
          python horizon/tools/verify_native_registry.py --family river-foundations --report build/qa/ci/native-river-foundations.json
          python horizon/tools/verify_native_registry.py --family river-carvers --report build/qa/ci/native-river-carvers.json
          python horizon/tools/verify_native_registry.py --family river-networks --report build/qa/ci/native-river-networks.json
          python horizon/tools/verify_kernel_terrain.py --stages unfiltered --report build/qa/ci/native-original-kernel-unfiltered.json
          python horizon/tools/verify_native_registry.py --family tile-filters --report build/qa/ci/native-tile-filters.json
          python horizon/tools/verify_kernel_terrain.py --stages full --report build/qa/ci/native-original-kernel-full.json
          python horizon/tools/verify_tile_cache_lifecycle.py --report build/qa/ci/native-tile-cache-lifecycle.json
          python horizon/tools/verify_kernel_terrain.py --stages sampled --report build/qa/ci/native-cached-columns.json
          python horizon/tools/verify_native_registry.py --family density-primitives --report build/qa/ci/native-density-primitives.json
          python horizon/tools/verify_native_registry.py --family classic-biomes --report build/qa/ci/native-classic-biome-policy.json
      - name: Retain foundation reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-noise-${{ matrix.os }}-${{ github.sha }}
          path: build/qa/ci/native-*.json
          if-no-files-found: error
          retention-days: 14
